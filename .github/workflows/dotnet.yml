name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x' # Visual Studio 2026 targets .NET 9 by default

    - name: Restore dependencies
      run: dotnet restore TestTarifffs.slnx

    - name: Build Solution
      run: dotnet build TestTarifffs.slnx --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test TestTarifffs.slnx --no-build --configuration Release --verbosity normal
