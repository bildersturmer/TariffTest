name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # This forces the .NET SDK to use the modern Microsoft.Testing.Platform runner globally
  DOTNET_TEST_RUNNER: Microsoft.Testing.Platform

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.x'

    - name: Restore dependencies
      run: dotnet restore TestTarifffs.slnx

    - name: Build Solution
      run: dotnet build TestTarifffs.slnx --no-restore --configuration Release

    - name: Run Unit Tests
      # Modern MTP mode expects the --solution flag explicitly when targeting a solution file
      run: dotnet test --solution TestTarifffs.slnx --no-build --configuration Release
